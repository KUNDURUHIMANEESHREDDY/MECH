# Factory configuration for MECH — low autonomy, manual runs only.
# Convention reference: https://github.com/BuilderIO/skills/blob/main/docs/factory/configuration.md
# This file is policy text only. It installs no connectors, grants no permissions,
# and creates no scheduled jobs. This host has no chat/DM connector and no job
# scheduler, so all workflows below are manual and the agent's session reply is
# the only notification channel.
version: 1
timezone: UTC

repositories:
  - id: mech
    provider: github
    remote: KUNDURUHIMANEESHREDDY/MECH
    worktree:
      mode: fresh-per-run
      base: origin/master

sources:
  - id: code-issues
    provider: github
    type: issue
    scope: KUNDURUHIMANEESHREDDY/MECH
    integration: gh-cli
    read_tool: gh issue list / gh pr list / gh pr view (JSON fields)
    pagination: use --limit with --paginate and read every page
  - id: local-delivery
    provider: custom
    type: delivery
    scope: local worktree at C:\Users\himan\OneDrive\Documents\Default Project\MECH (branch master)
    integration: shell
    read_tool: git status -sb; git log origin/master..HEAD; git stash list; git branch -a
    pagination: not applicable, single worktree snapshot per run

workflows:
  collect:
    enabled: false
  lookback:
    enabled: false
  human-digest:
    enabled: false
  pull-requests:
    enabled: false
  pr-babysitting:
    enabled: false
  ship-watchdog:
    enabled: true
    schedule: manual
    notify:
      mode: meaningful-change-only
      destination: in-session report to the user; this host exposes no chat, DM, or mail connector
      cadence: on explicit watchdog invocation only, never on a timer
      rate-limit: one summary per invocation; no repeat reminders for unchanged state
  recovery:
    enabled: false

skill_prompts:
  factory-watchdog: |
    This repo never pushes without the user's explicit confirmation, so an
    unpushed local stack is a standing human decision, not a notifiable stall:
    report it as context, never as a next step. Verify PR head OIDs, mergeable
    state, check conclusions, and review decisions live via gh immediately
    before claiming anything; UNKNOWN mergeability or missing reviews means
    hold for a person. Report DONT_NOTIFY when nothing meaningful changed.
