name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:js
      - run: npm run build:renderer

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --isolated --no-cache --select E9,F821 --output-format concise backend tests scripts

  backend-fast:
    name: backend-fast
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-fast-${{ runner.os }}-py311-v1
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/pytest -q --maxfail=1 --tb=short --durations=25 -k 'comparison or model_lock or tuned_lens'

  backend:
    name: backend shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}-v1
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import backend.main; print('backend.main imports')"
      - run: python -c "import sys; sys.path.insert(0,'backend'); import datasets; assert 'site-packages' in datasets.__file__, datasets.__file__"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Backend pytest shard with actionable failure and duration report
        env:
          MECH_REQUIRE_JS_LINT: '1'
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARDS: '8'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path("tests/pytest")
          files = sorted({*root.rglob("test_*.py"), *root.rglob("*_test.py")})
          if not files:
              raise SystemExit("No pytest files were found.")
          shard_count = int(os.environ["PYTEST_SHARDS"])
          shard = int(os.environ["PYTEST_SHARD"])
          buckets = [[] for _ in range(shard_count)]
          loads = [0] * shard_count
          # Deterministic largest-first balancing by file size to avoid putting
          # every expensive test module into the same shard.
          for path in sorted(files, key=lambda p: (-p.stat().st_size, p.as_posix())):
              target = loads.index(min(loads))
              buckets[target].append(path.as_posix())
              loads[target] += path.stat().st_size
          selected = buckets[shard - 1]
          if not selected:
              raise SystemExit(f"No pytest files assigned to shard {shard}/{shard_count}.")
          print(f"Running {len(selected)} test files in shard {shard}/{shard_count}.")
          subprocess.run(
              [
                  sys.executable, "-m", "pytest", *selected,
                  "-q", "--maxfail=1", "--tb=short", "--durations=25",
                  "--show-capture=all",
              ],
              check=True,
          )
          PY

  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}-v1
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify GPT-2 weights load
        run: |
          python - <<'PY'
          from backend.services import gpt2_engine
          assert gpt2_engine.is_available(), "GPT-2 stack unavailable"
          status = gpt2_engine.load()
          assert status.get("status") == "loaded", status
          result = gpt2_engine.run_prompt("The capital of France is")
          assert result.get("status") in ("completed", "ok"), result
          assert result.get("str_tokens"), result
          print("gpt2 weights loaded:", status)
          PY
      - name: Live validation loop
        run: python -m pytest tests/pytest/test_validation_loop.py -v
      - name: Attestation must hash real weights
        run: |
          python - <<'PY'
          from backend.science.reproducibility.model_fingerprint import ModelFingerprintEngine
          from backend.science.models.gpt2_adapter import GPT2Adapter
          adapter = GPT2Adapter(variant="small", mock_mode=False)
          fp = ModelFingerprintEngine().capture(adapter)
          assert fp.attested, fp.attestation_reason
          assert "mock" not in fp.weights_sha256
          assert len(fp.weights_sha256.split(":", 1)[1]) == 64
          assert fp.parameter_count > 100_000_000, fp.parameter_count
          print("weights sha256:", fp.weights_sha256)
          print("parameters:", fp.parameter_count)
          PY
      - name: Evidence boundary refuses unproven live claims
        run: >-
          python -m pytest tests/pytest/test_attestation_laundering.py
          tests/pytest/test_attested_evidence.py
          tests/pytest/test_provenance_not_inverted.py -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/playwright/desktop-os-shell.spec.js tests/playwright/desktop-tool-pages.spec.js tests/playwright/research-workflow-heatmap.spec.js tests/playwright/shell-smoke.spec.js tests/playwright/trust.spec.js

  security:
    name: Dependency, secret, and SBOM scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit cyclonedx-bom
      - name: Audit installed Python runtime and development dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pip-audit --strict
      - name: Generate CycloneDX SBOM for installed environment
        run: cyclonedx-py environment --output-format JSON --output-file mech-python-sbom.json
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: mech-python-sbom
          path: mech-python-sbom.json
          if-no-files-found: error

  required:
    name: required
    if: ${{ always() }}
    needs: [lint, frontend, backend-fast, backend, live-evidence, e2e, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce every release check
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_FAST_RESULT: ${{ needs.backend-fast.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LIVE_EVIDENCE_RESULT: ${{ needs.live-evidence.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          printf '%s\n' \
            "lint=$LINT_RESULT" \
            "frontend=$FRONTEND_RESULT" \
            "backend-fast=$BACKEND_FAST_RESULT" \
            "backend=$BACKEND_RESULT" \
            "live-evidence=$LIVE_EVIDENCE_RESULT" \
            "e2e=$E2E_RESULT" \
            "security=$SECURITY_RESULT"
          for result in \
            "$LINT_RESULT" \
            "$FRONTEND_RESULT" \
            "$BACKEND_FAST_RESULT" \
            "$BACKEND_RESULT" \
            "$LIVE_EVIDENCE_RESULT" \
            "$E2E_RESULT" \
            "$SECURITY_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Release gate failed: every required check must succeed (got $result)."
              exit 1
            fi
          done
          echo "All required release checks passed."
