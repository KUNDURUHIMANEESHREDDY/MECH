name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # better-sqlite3 postinstall needs node-gyp; vitest does not need it.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:js
      - run: npm run build:renderer

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}-v1
      # CPU torch first so requirements.txt keeps it (no CUDA wheels on CI).
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/pytest -q

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Offline specs only (Desktop OS shell, directory, status): no Python backend on CI.
      - run: npx playwright test tests/playwright/desktop-os-shell.spec.js tests/playwright/shell-smoke.spec.js tests/playwright/trust.spec.js
