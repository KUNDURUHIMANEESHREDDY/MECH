name: Security scanning

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency, secret, and SBOM scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit cyclonedx-bom
      - name: Audit installed Python runtime and development dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pip-audit --strict
      - name: Generate CycloneDX SBOM for installed environment
        run: cyclonedx-py environment --output-format JSON --output-file mech-python-sbom.json
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: mech-python-sbom
          path: mech-python-sbom.json
          if-no-files-found: error
