name: PR Auto-Merge

on:
  schedule:
    # GitHub cron is UTC. These two schedules alternate every 90 minutes:
    # 00:00, 01:30, 03:00, 04:30, ... 22:30 UTC.
    - cron: "0 0-21/3 * * *"
    - cron: "30 1-22/3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-auto-merge
  cancel-in-progress: false

jobs:
  merge-eligible:
    name: Merge eligible pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and merge eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh pr list --repo "$GH_REPO" --base "$TARGET_BRANCH" --state open --limit 100 \
            --json number,title,isDraft,reviewDecision,statusCheckRollup,mergeable,mergeStateStatus,headRefOid)"

          count="$(jq 'length' <<< "$prs")"
          echo "Found $count open PR(s) targeting $TARGET_BRANCH."

          if [[ "$count" -eq 0 ]]; then
            echo "Nothing to merge."
            exit 0
          fi

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title' <<< "$pr")"
            draft="$(jq -r '.isDraft' <<< "$pr")"
            review="$(jq -r '.reviewDecision // "REVIEW_REQUIRED"' <<< "$pr")"
            mergeable="$(jq -r '.mergeable' <<< "$pr")"
            merge_state="$(jq -r '.mergeStateStatus' <<< "$pr")"
            head_sha="$(jq -r '.headRefOid' <<< "$pr")"

            if [[ "$draft" == "true" ]]; then
              echo "SKIP #$number: draft PR."
              continue
            fi

            if [[ "$review" != "APPROVED" ]]; then
              echo "SKIP #$number: review decision is $review (approval required)."
              continue
            fi

            if [[ "$mergeable" != "MERGEABLE" || "$merge_state" != "CLEAN" ]]; then
              echo "SKIP #$number: mergeable=$mergeable, mergeStateStatus=$merge_state."
              continue
            fi

            checks="$(jq -c '.statusCheckRollup // []' <<< "$pr")"
            check_count="$(jq 'length' <<< "$checks")"
            if [[ "$check_count" -eq 0 ]]; then
              echo "SKIP #$number: no CI/status checks were reported."
              continue
            fi

            checks_ok="$(jq -r '
              all(.[];
                if has("status") then
                  .status == "COMPLETED" and .conclusion == "SUCCESS"
                else
                  .state == "SUCCESS"
                end
              )
            ' <<< "$checks")"

            if [[ "$checks_ok" != "true" ]]; then
              echo "SKIP #$number: one or more CI/security checks are pending or failing."
              continue
            fi

            echo "MERGE #$number: $title"
            # Pin the merge to the head SHA inspected above to avoid merging
            # if new commits arrive between the checks and the merge request.
            if gh pr merge "$number" --repo "$GH_REPO" --squash --delete-branch=false --match-head-commit "$head_sha"; then
              echo "Merged PR #$number."
            else
              echo "Could not merge PR #$number; GitHub may have rejected it due to branch protection or a changed PR."
            fi
          done < <(jq -c '.[]' <<< "$prs")
